# Проверка каждого push и pull request: тесты, сборка .deb, установка и удаление на Ubuntu,
# установка из подписанного apt-репозитория (временный ключ), сборка пакета для Arch.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 tests/test_core.py
      - name: Build .deb
        run: sh packaging/debian/build-deb.sh
      - name: Install from apt repository
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-gen-key 'CI test <ci@example.invalid>' ed25519 sign 1d
          FPR=$(gpg --list-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          sh scripts/update-apt-repo.sh /tmp/repo "$PWD/$(ls dist/*.deb)" "$FPR"
          sudo cp /tmp/repo/kachaning-archive-keyring.gpg /usr/share/keyrings/ci-test.gpg
          echo "deb [signed-by=/usr/share/keyrings/ci-test.gpg] file:///tmp/repo stable main" | sudo tee /etc/apt/sources.list.d/ci-test.list
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ci-test.list -o Dir::Etc::sourceparts=-
          sudo apt-get install -y kachaning
      - name: Check installed package
        run: |
          test "$(kachaning --version)" = "$(python3 kachaning.py --version)"
          kachaning --icon | grep -q '<svg'
          desktop-file-validate /usr/share/applications/kachaning.desktop || true
          test -f /etc/apt/sources.list.d/kachaning.list
          python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk"
      - name: Remove cleans up
        run: |
          printf 'nobody ALL=(ALL) NOPASSWD: ALL\n' | sudo tee /etc/sudoers.d/90-kachaning
          sudo apt-get remove -y kachaning
          test ! -e /etc/sudoers.d/90-kachaning
          test ! -e /usr/share/kachaning

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build and install with makepkg
        run: |
          pacman -Syu --noconfirm --needed python python-gobject gtk3 polkit openssh sudo git
          useradd -m builder
          mkdir /build && tar --exclude=./.git --transform "s,^\.,kachaning-$(python kachaning.py --version)," -czf /build/src.tar.gz .
          sed -e 's|^source=.*|source=("src.tar.gz")|' packaging/arch/PKGBUILD > /build/PKGBUILD
          cp packaging/arch/kachaning.install /build/
          chown -R builder /build
          su builder -c 'cd /build && makepkg --noconfirm'
          pacman -U --noconfirm /build/*.pkg.tar.zst
          test "$(kachaning --version)" = "$(python kachaning.py --version)"
          pacman -R --noconfirm kachaning
          test ! -e /usr/share/kachaning
